plugin_configs:
  - id: "plugin-config-s3-bucket-guard-hcm"
    plugins:

      custom.s3-network-bucket-guard:
        network_id_header: "X-Network-Id"
        client_ip_header: "X-Client-IP"
        apex_host: "s3-hcm.sds.infiniband.vn"
        vault_mount: "cloud/profile"
        vault_prefix: "app/apisix-proxyhub/network-buckets"   # namespace riêng, xác nhận quyền 'read' qua sys/capabilities-self
        cache_ttl: 60
        fail_open: false
        reject_code: 403

        # Allowlist mặc định trên Vault (<vault_mount>/data/<vault_prefix>/_default-hcm) cho request
        # KHÔNG có X-Network-Id hoặc network_id chưa onboard. Tách key theo site để endpoint HCM
        # chỉ nhận bucket của site HCM. PHẢI tạo key này trên Vault TRƯỚC khi push — thiếu key
        # thì mọi request nhắm bucket bị 403 "bucket allowlist not configured".
        # Xóa dòng này = quay về hành vi cũ (thiếu network_id thì bỏ qua allowlist).
        default_allowlist_key: "_default-hcm"

      # ip-restriction:
      #   # blacklist: []
      #   blacklist:
      #     - "198.51.100.44"
      #     # - "999.999.999.999"
      #     # - "198.51.100.44

      # custom.test-header-capture:
      #   header_name: "X-Dry-Run-Test"

