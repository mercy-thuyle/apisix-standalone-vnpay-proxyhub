routes:
  # ── VCR ──
  - id: "route-vcr"
    name: "vcr"
    status: 1
    service_id: "service-upstream-vcr"
    # plugin_config_id: "plugin-config-s3-bucket-guard"
    uri:
      - "/*"
      # - "/kaas"
      # - "/kaas/*"
    hosts:
      - "vcr.infiniband.vn"
      - "*.vcr.infiniband.vn"
    # vars:
    #   - ["scheme", "==", "http"]

    plugins:
      # Giới hạn cứng path trong /kaas (spec mục 06.3) — block_rules match theo
      # ctx.var.request_uri (đã normalize từ APISIX >= 2.10.2, fix CVE-2021-43557,
      # bản 3.17.0 đang dùng không bị ảnh hưởng). Lookahead phủ định: match (=> block)
      # MỌI uri KHÔNG bắt đầu đúng "/kaas" + ("/" | "?" | hết chuỗi) — 3 điều kiện
      # kết thúc để không chặn nhầm "/kaas" trần và "/kaas?x=1" (query string).
      uri-blocker:
        block_rules:
          - "^(?!/kaas([/?]|$))"
        rejected_code: 403
        rejected_msg: "Your path not allowed on VCR route, only /kaas is served."

    timeout:
      connect: 60
      send: 600
      read: 600
