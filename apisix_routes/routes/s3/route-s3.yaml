routes:
  # ── S3 ──
  - id: "route-s3-hcm"
    name: "s3"
    status: 1
    service_id: "service-upstream-s3-hcm"
    plugin_config_id: "plugin-config-s3-bucket-guard-hcm"
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
    # vars:
    #   - ["scheme", "==", "http"]
    #   - ["remote_addr", "!=", "172.26.29.231"]

    plugins:
      # Không gửi X-Forwarded-Port lên APISIX S3 → Cloudian: Cloudian dùng XFP khi tính lại SigV4, có header là 403 SignatureDoesNotMatch (A/B: direct-xfp443 → 403).
      # Cần đủ 2 lệnh: ngx_tpl luôn proxy_set_header X-Forwarded-Port $var_x_forwarded_port (mặc định $server_port=443),
      # và init.lua set_upstream_x_forwarded_headers() chạy SAU access plugins, ghi đè var này bằng http_x_forwarded_port nếu header còn.
      # → xóa header (đồng thời clear cache ctx.var) để hàm trên không ghi đè, rồi gán var rỗng: nginx không gửi header có giá trị rỗng.
      # Trước đây sai: chỉ clear_header ở before_proxy hoặc chỉ gán var ở access → đều bị ghi đè, XFP=443 vẫn đi ra upstream.
      # Xóa block này: mọi request S3 qua ProxyHub lại 403 SignatureDoesNotMatch.
      serverless-pre-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              local core = require("apisix.core")
              core.request.set_header(ctx, "X-Forwarded-Port", nil)
              ngx.var.var_x_forwarded_port = ""
            end

    #   custom.s3-normalizer-bucket-name:
    #     path_hosts:
    #       - "s3-hcm.sds.infiniband.vn"
    #     vhost_domains:
    #       - "s3%-hcm%.sds%.infiniband%.vn"

    #   custom.s3-accesskey-extractor:
    #     set_header: "X-S3-Access-Key"
    #     anonymous_use_ip: true

    #   custom.s3-qos-consumer: {}

    #   custom.s3-traffic-classifier: {}

    timeout:
      connect: 60
      send: 600
      read: 600

  - id: "route-s3-hni"
    name: "s3"
    status: 1
    service_id: "service-upstream-s3-hni"
    plugin_config_id: "plugin-config-s3-bucket-guard-hni"
    uri: "/*"
    hosts:
      - "s3-hni.sds.infiniband.vn"
      - "*.s3-hni.sds.infiniband.vn"
    # vars:
    #   - ["scheme", "==", "http"]
    #   - ["remote_addr", "!=", "172.26.29.231"]

    plugins:
      serverless-pre-function:
        phase: access
        functions:
          - |
            return function(conf, ctx)
              -- APISIX nginx template tự set X-Forwarded-Port khi
              -- proxy_pass. Cloudian S3 nhận request SigV4 qua ProxyHub
              -- trả SignatureDoesNotMatch khi header này xuất hiện
              -- sau lúc client đã ký request.
              --
              -- Gán biến nginx rỗng ở access phase để outbound hop
              -- ProxyHub -> Internal S3 APISIX không có header này.
              ngx.var.var_x_forwarded_port = ""
            end

    #   custom.s3-normalizer-bucket-name:
    #     path_hosts:
    #       - "s3-hcm.sds.infiniband.vn"
    #     vhost_domains:
    #       - "s3%-hcm%.sds%.infiniband%.vn"

    #   custom.s3-accesskey-extractor:
    #     set_header: "X-S3-Access-Key"
    #     anonymous_use_ip: true

    #   custom.s3-qos-consumer: {}

    #   custom.s3-traffic-classifier: {}

    timeout:
      connect: 60
      send: 600
      read: 600
