routes:
  # ── MAAS Logs (Loki) ──
  - id: "route-maas-logs"
    name: "maas-logs"
    status: 1
    service_id: "service-upstream-maas-logs"
    uri: "/*"
    hosts:
      - "sb-logs-observe.infiniband.vn"
    timeout:
      connect: 60
      send: 600
      read: 600

  # ── MAAS Metrics (Mimir) ──
  - id: "route-maas-metrics"
    name: "maas-metrics"
    status: 1
    service_id: "service-upstream-maas-metrics"
    uri: "/*"
    hosts:
      - "sb-metrics-observe.infiniband.vn"
    timeout:
      connect: 60
      send: 600
      read: 600
