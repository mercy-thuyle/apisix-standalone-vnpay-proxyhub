global_rules:
  - id: global-kafka-logger-han
    # status: 0
    plugins:
      kafka-logger:
        brokers:
          - host: "10.76.38.160"
            port: 9094
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"
          - host: "10.76.38.178"
            port: 9094
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"
          - host: "10.76.38.237"
            port: 9094
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"

        kafka_topic: "apisix-${{DC_PROFILE}}"
        producer_type: async 
        batch_max_size: 1
        include_resp_body: false
        # include_resp_body_expr: []
        timeout: 3
        # key: "$remote_addr"
        ssl: true
        ssl_verify: false
        meta_format: default
        api_version: 2
