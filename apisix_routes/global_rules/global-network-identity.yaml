global_rules:
  - id: "global-network-identity"
    plugins:
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              -- network_id chỉ tồn tại trong TLV unique_id (0x05) của PROXY-v2, do HAProxy
              -- gán tại tầng ovnmeta-<netid> (unique-id-format <network_id>) trước khi vào
              -- unix socket. KHÔNG lấy từ $remote_addr — sau real_ip_header=proxy_protocol,
              -- $remote_addr chỉ còn là client IP gốc của VM, không mang network_id.
              local network_id = ngx.var.proxy_protocol_tlv_unique_id
              if not network_id or network_id == "" then
                -- Không có TLV nghĩa là kết nối không qua đúng đường HAProxy/socat như thiết kế
                -- (vd test tay, hoặc lỗi tầng trước) — chặn thẳng, không forward mù backend.
                return ngx.exit(403)
              end

              ngx.req.set_header("X-Network-Id", network_id)
              ngx.req.set_header("X-Client-IP", ngx.var.remote_addr)
            end
