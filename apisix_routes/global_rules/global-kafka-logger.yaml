global_rules:
  - id: global-kafka-logger
    # status: 0
    plugins:
      kafka-logger:
        brokers:
          - host: "172.26.24.80"
            port: 31421
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"
          - host: "172.26.24.80"
            port: 30215
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"
          - host: "172.26.24.80"
            port: 30412
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"

        kafka_topic: "apisix-gateway-${{DC_PROFILE}}"
        producer_type: async 
        batch_max_size: 1
        include_resp_body: false
        # include_resp_body_expr: []
        timeout: 3
        # key: "$remote_addr"
        ssl: true
        ssl_verify: false
        meta_format: default
        api_version: 2
