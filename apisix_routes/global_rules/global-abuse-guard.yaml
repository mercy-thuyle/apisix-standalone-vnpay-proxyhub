global_rules:
  - id: global-abuse-guard
    plugins:

      limit-count:
        rules:
          - key: "${http_x_node_id}"
            count: 50000
            time_window: 60
            header_prefix: "Global"
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:global-guard]: Too many total requests on this gateway node in the last 60s. Not a Cloudian error — this is gateway-level global throttling."
        allow_degradation: true
        show_limit_quota_header: true
        policy: local

      limit-conn:
        rules:
          - key: "${http_x_node_id}"
            conn: 49500
            burst: 500
        rejected_code: 429        # KHÔNG để mặc định 503 → 429 cho user/dev rõ
        rejected_msg: "[APISIX-QOS:global-guard]: Too many total concurrent connections on this gateway node. Concurrent connection limit exceeded (< 50000). This is gateway-level global throttling."
        default_conn_delay: 0.1
        only_use_default_delay: true
        allow_degradation: true
        policy: local

      # ⚠️ CHỈ 1 serverless-pre-function được phép hiệu lực trong TOÀN BỘ
      # global_rules — APISIX loại bỏ khỏi execution list (silent, chỉ log
      # warn "Removing it from execution list") nếu có >1 global_rule cùng
      # khai plugin này, KHÔNG merge/chạy cả hai. Đã xảy ra thật khi tách
      # riêng global-network-identity.yaml — cả 2 logic (X-Node-Id VÀ
      # X-Network-Id) đều bị vô hiệu hoá cùng lúc, không có exception nào.
      # → Mọi logic serverless-pre-function cấp global PHẢI gộp chung 1 file.
      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              -- TRACE TẠM CHO TEST SigV4: chỉ log request do script
              -- s3-proxyhub-path-compare.sh tạo. Không log Authorization,
              -- Signature hoặc giá trị session token.
              local user_agent = ngx.var.http_user_agent or ""
              if user_agent:find("exec-env/s3-path-compare-", 1, true) then
                local authorization = ngx.var.http_authorization or ""
                local signed_headers = authorization:match("[, ]SignedHeaders=([^,]+)") or "-"
                local authorization_md5 = authorization ~= "" and ngx.md5(authorization) or "-"
                local trace_tag = user_agent:match("(exec%-env/s3%-path%-compare%-%S+)") or "-"

                ngx.log(ngx.WARN,
                  "[S3-SIGV4-TRACE]",
                  " hop=proxyhub-in",
                  " trace=", trace_tag,
                  " method=", ngx.req.get_method(),
                  " host=", ngx.var.http_host or "-",
                  " uri=", ngx.var.request_uri or "-",
                  " x_amz_date=", ngx.var.http_x_amz_date or "-",
                  " x_amz_content_sha256=", ngx.var.http_x_amz_content_sha256 or "-",
                  " authorization_md5=", authorization_md5,
                  " signed_headers=", signed_headers,
                  " x_amz_security_token_present=",
                  (ngx.var.http_x_amz_security_token and "true" or "false")
                )
              end


              -- NODE_ID lấy từ ENV do docker-compose set (apisix-standalone-${PROJECT}-${DC_SITE}-${ORDER_NUM}).
              -- Đặt ở ĐÂY vì serverless-pre-function (priority 10000) chạy TRƯỚC limit-conn (1003)/
              -- limit-count (1002) trong cùng phase rewrite — header set kịp trước khi 2 plugin limit
              -- đọc key "http_x_node_id".
              ngx.req.set_header("X-Node-Id", os.getenv("NODE_ID") or "-")
              ngx.req.set_header("X-Route-Id", ctx.matched_route and ctx.matched_route.value.id or "-")
              ngx.req.set_header("X-Service-Id", ctx.matched_route and ctx.matched_route.value.service_id or "-")
              -- consumer_name: giống route_id, KHÔNG phải nginx variable có sẵn ($consumer_name
              -- sẽ làm nginx crash compile y hệt $route_id). Lấy qua ctx.consumer (Lua), set
              -- header để access_log_format đọc qua $http_x_consumer thay vì gọi thẳng biến.
              -- Chỉ có giá trị khi route dùng key-auth/jwt-auth (consumer_groups); S3 SDK ký
              -- SigV4 thì ctx.consumer là nil → fallback "-".
              ngx.req.set_header("X-Consumer", ctx.consumer and ctx.consumer.username or "-")

              -- network_id lấy từ TLV unique_id (0x05) của PROXY-v2, do HAProxy gán tại
              -- tầng ovnmeta-<netid> (unique-id-format <network_id>) trước khi vào unix
              -- socket. KHÔNG lấy từ $remote_addr — sau real_ip_header=proxy_protocol,
              -- $remote_addr chỉ còn là client IP gốc của VM, không mang network_id.

              -- Đổi chính sách 18/09/2026: network_id KHÔNG còn bắt buộc (trước đây thiếu
              -- TLV 0x05 sẽ ngx.exit(403) thẳng ở đây). Thiếu TLV (test tay, client không
              -- qua đúng đường HAProxy/socat, hoặc HAProxy chưa gán unique-id) giờ KHÔNG
              -- còn bị chặn ở guard này — request đi tiếp, downstream nhận diện qua
              -- X-Client-IP thay thế. Layer nào thật sự cần BẮT BUỘC network_id (vd
              -- s3-network-bucket-guard) phải tự fail-closed riêng khi thiếu header, guard
              -- này không còn là nơi enforce duy nhất.
            
              -- Tạm thời tắt policy bucket theo network identity: không inject
              -- X-Network-Id từ PROXY-v2 TLV. Bucket guard sẽ bypass Vault
              -- allowlist khi header này không tồn tại; Cloudian xử lý quyền
              -- bucket/object qua SigV4.
              --
              -- Khi cần bật lại bucket allowlist, thay ngx.req.clear_header(...)
              -- bên dưới bằng block này:
              --
              -- local network_id = ngx.var.proxy_protocol_tlv_unique_id
              -- if network_id and network_id ~= "" then
              --   ngx.req.set_header("X-Network-Id", network_id)
              -- else
              --   ngx.req.clear_header("X-Network-Id")
              -- end
              --
              -- Clear chủ động để không nhận cả X-Network-Id do client tự gửi.
              ngx.req.clear_header("X-Network-Id")
 
              -- Chỉ phục vụ quan sát/debug; không còn được bucket guard dùng
              -- làm Vault identity fallback.

              ngx.req.set_header("X-Client-IP", ngx.var.remote_addr)
            end
