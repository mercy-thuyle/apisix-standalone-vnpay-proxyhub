ssls:
  - id: "ssl-infiniband.vn"
    status: 1
    snis:
      - "*.infiniband.vn"
      - "infiniband.vn"
    ssl_protocols:
      - TLSv1.2
      - TLSv1.3

    # cert: |
    #   <PASTE_CONTENT_OF_infiniband.vn.cert_HERE>
    # key: |
    #   <PASTE_CONTENT_OF_infiniband.vn.key_HERE>

    # Dùng cho vault
    # cert: "$secret://vault/vault-provider/infiniband.vn/cert"
    # key:  "$secret://vault/vault-provider/infiniband.vn/key"
    # cert: "$secret://vault/cloud/profile/data/app/apisix/certs/infiniband.vn/cert"
    # key: "$secret://vault/cloud/profile/data/app/apisix/certs/infiniband.vn/key"
    cert: "$secret://vault/vault-provider/app/apisix-proxyhub/certs/infiniband.vn/cert"
    key:  "$secret://vault/vault-provider/app/apisix-proxyhub/certs/infiniband.vn/key"
