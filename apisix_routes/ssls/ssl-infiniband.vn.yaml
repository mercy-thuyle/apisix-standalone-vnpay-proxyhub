ssls:
  - id: "ssl-infiniband.vn"
    status: 1
    snis:
      - "*.infiniband.vn"
      - "infiniband.vn"
    ssl_protocols:
      - TLSv1.2
      - TLSv1.3

    cert: |
      <PASTE_CONTENT_OF_infiniband.vn.cert_HERE>
    key: |
      <PASTE_CONTENT_OF_infiniband.vn.key_HERE>

    # Dùng cho vault
    # cert: "$secret://vault/vault-provider/infiniband.vn/cert"
    # key:  "$secret://vault/vault-provider/infiniband.vn/key"

    # Gọi chính xác đường dẫn chứa /data/ để map trúng KV v2 của Vault Sandbox
