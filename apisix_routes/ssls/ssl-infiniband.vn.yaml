ssls:
  - id: "ssl-infiniband.vn"
    status: 1
    snis:
      - "*.infiniband.vn"
      - "infiniband.vn"
    ssl_protocols:
      - TLSv1.2
      - TLSv1.3

    cert: "$secret://vault/vault-provider/app/apisix-proxyhub/certs/infiniband.vn/cert"
    key:  "$secret://vault/vault-provider/app/apisix-proxyhub/certs/infiniband.vn/key"
