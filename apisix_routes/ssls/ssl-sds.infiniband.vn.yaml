ssls:
  - id: "ssl-sds.infiniband.vn"
    status: 1
    snis:
      - "*.sds.infiniband.vn"
      - "sds.infiniband.vn"
    ssl_protocols:
      - TLSv1.2
      - TLSv1.3

    cert: "$secret://vault/vault-provider/app/apisix-proxyhub/certs/sds.infiniband.vn/cert"
    key:  "$secret://vault/vault-provider/app/apisix-proxyhub/certs/sds.infiniband.vn/key"
