ssls:
  - id: "ssl-sds.infiniband.vn"
    status: 1
    snis:
      - "*.sds.infiniband.vn"
      - "sds.infiniband.vn"
    ssl_protocols:
      - TLSv1.2
      - TLSv1.3

    cert: |
      <PASTE_CONTENT_OF_sds.infiniband.vn.cert_HERE>
    key: |
      <PASTE_CONTENT_OF_sds.infiniband.vn.key_HERE>

    # Dùng cho vault
    # cert: "$secret://vault/vault-provider/sds.infiniband.vn/cert"
    # key:  "$secret://vault/vault-provider/sds.infiniband.vn/key"

    # Gọi chính xác đường dẫn chứa /data/ để map trúng KV v2 của Vault Sandbox
