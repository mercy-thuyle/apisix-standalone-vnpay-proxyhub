# =============================================================================
# redis/redis.conf — Redis cho APISIX rate-limit counter (SINGLE instance)
# Mount: ./redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
#
# ⚠ KHÔNG để password ở file này (file được commit). Inject qua CLI arg:
#   --requirepass ${REDIS_PASSWORD} (từ .env, gitignored). CLI ghi đè conf.
#
# ── FILE NÀY DÙNG CHO SCENARIO NÀO? ──────────────────────────────────────────
#   BLOCK 1 (self-host SINGLE)  → DÙNG NGUYÊN TRẠNG + service 'redis' ENABLED.
#   BLOCK 2 (self-host CLUSTER) → bỏ comment phần CLUSTER cuối file (xem cảnh báo).
#   BLOCK 3/4 (Redis NGOÀI)     → KHÔNG dùng file này:
#                                  comment service 'redis' trong docker-compose
#                                  + bỏ 'depends_on: redis' ở apisix-standalone.
# =============================================================================

# ── Network ──────────────────────────────────────────────────────────────────
# bind 127.0.0.1: chỉ nghe loopback (apisix cùng network_mode host → 127.0.0.1).
# MULTI-VM dùng chung 1 Redis: thêm IP nội bộ (vd: bind 127.0.0.1 10.0.0.50)
#   + firewall chỉ mở cho IP các node APISIX.
bind 127.0.0.1
port 6379
protected-mode yes
tcp-backlog 511
timeout 0
tcp-keepalive 300

# ── Bộ nhớ & eviction ────────────────────────────────────────────────────────
# Counter nhỏ, đều có TTL (= time_window). allkeys-lru: đầy RAM thì evict key cũ
# thay vì để INCR lỗi OOM.
maxmemory 256mb
maxmemory-policy allkeys-lru

# ── Persistence: TẮT (counter ephemeral) ─────────────────────────────────────
save ""
appendonly no

# ── Logging / Databases ──────────────────────────────────────────────────────
# loglevel trong redis.conf:
#   debug   → log tất cả, kể cả nội bộ (rất nhiều, dùng khi debug sâu)
#   verbose → log nhiều thông tin hữu ích
#   notice  → mặc định, chỉ log sự kiện quan trọng (start/stop/save), log ra stdout → docker json-file thu
#   warning → chỉ log lỗi nghiêm trọng

# Để log TỪNG LỆNH (GET/SET/EXPIRE...) cần dùng:
#   → SLOWLOG (chỉ log lệnh chạy chậm, có ngưỡng)
#   → MONITOR (debug command, không nên chạy thường trực — tốn CPU)
#   → KHÔNG có config nào log mọi lệnh ra file thường trực
#     (đây là giới hạn thiết kế của Redis, không phải thiếu sót)
loglevel verbose      

# Log ra file thay vì stdout (mặc định stdout khi chạy Docker)
logfile "/data/logs/redis.log"

# Bật slowlog — log các lệnh chạy chậm hơn ngưỡng (microsecond)
# 10000 = 10ms — lệnh nào chậm hơn 10ms sẽ bị log
slowlog-log-slower-than 10000
slowlog-max-len 1000

# cần ≥2 để APISIX dùng database 1 (single mode)
databases 16

# ── An toàn vận hành (tuỳ chọn) ──────────────────────────────────────────────
# rename-command FLUSHALL ""
# rename-command FLUSHDB  ""
# rename-command CONFIG   ""

# ═════════════════════════════════════════════════════════════════════════════
#  (BLOCK 2) CLUSTER MODE — bỏ comment nếu chạy SELF-HOST CLUSTER
#  ⚠ CẢNH BÁO: 1 process redis = 1 node cluster. Cluster thật cần ≥3 master
#    (+replica) = 6 process trên 6 port khác nhau → KHÔNG dựng được bằng 1
#    service redis.conf này. Muốn self-host cluster phải có compose riêng tạo
#    6 container + chạy 'redis-cli --cluster create'. Thực tế: cluster nên là
#    Redis NGOÀI (BLOCK 4); self-host thì để SINGLE (BLOCK 1).
#  ⚠ Cluster CHỈ có db 0 → fragment phải BỎ 'redis_database'.
# ─────────────────────────────────────────────────────────────────────────────
# cluster-enabled yes
# cluster-config-file nodes.conf
# cluster-node-timeout 5000
# cluster-require-full-coverage no
# ═════════════════════════════════════════════════════════════════════════════
