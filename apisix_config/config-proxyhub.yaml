apisix:
  node_listen:
    - port: 80

  proxy_protocol:
    listen_https_port: 8443
    enable_tcp_pp: false

  enable_server_tokens: false

  enable_ipv6: false
  enable_http2: false

  show_upstream_status_in_response_header: false

  extra_lua_path: "/usr/local/apisix/apisix/plugins/libraries/?.lua"
  extra_lua_cpath: "/usr/local/apisix/apisix/plugins/libraries/?.so"

  ssl:
    enable: true
    listen:
      - port: 443
      # - port: 8443
    ssl_protocols: "TLSv1.2 TLSv1.3"
    ssl_ciphers: "ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384:DHE-RSA-AES128-GCM-SHA256:DHE-RSA-AES256-GCM-SHA384"
    ssl_session_timeout: "86400s"
    # ssl_certificate: /usr/local/apisix/certs/sds.infiniband.vn.cert
    # ssl_certificate_key: /usr/local/apisix/certs/sds.infiniband.vn.key
    # fallback_sni: "sds.infiniband.vn"

deployment:
  role: data_plane
  role_data_plane:
    config_provider: yaml

nginx_config:
  worker_processes: auto
  # worker_processes: 2
  worker_cpu_affinity: auto
  worker_rlimit_nofile: 32768

  event:
    worker_connections: 32768

  error_log: /usr/local/apisix/logs/error.log
  error_log_level: warn

  http_configuration_snippet: |
    client_body_buffer_size 32k;

    proxy_buffer_size 16k;
    proxy_buffers 8 16k;
    proxy_busy_buffers_size 32k;

  http:
    real_ip_header: "proxy_protocol"
    real_ip_from:
      - "172.25.180.0/24"

    access_log_format: '{"time": "$time_iso8601", "remote_addr": "$remote_addr", "network_id": "$http_x_network_id", "service_id": "$http_x_service_id", "consumer": "$http_x_consumer", "status": $status, "request_method": "$request_method", "request_uri": "$request_uri", "host": "$http_host", "akid": "$http_x_s3_access_key", "upstream_addr": "$upstream_addr", "upstream_status": "$upstream_status", "rt_limit": "$sent_http_x_ratelimit_limit", "rt_remaining": "$sent_http_x_ratelimit_remaining", "rt_warning": "$sent_http_x_ratelimit_warning", "request_time": $request_time, "bytes_sent": $body_bytes_sent, "ua": "$http_user_agent"}'
    access_log_format_escape: json
    access_log: /usr/local/apisix/logs/access.log

    server_names_hash_bucket_size: 128

    client_max_body_size: "5120m"
    client_body_timeout: 600
    client_header_timeout: 150

    keepalive_timeout: 650
    keepalive_requests: 1000

    # upstream_keepalive_pool_size: 512
    # upstream_keepalive_idle_timeout: 60

    # sendfile: on
    # server_tokens: off
    # send_timeout: 300s

    proxy_connect_timeout: 60
    proxy_send_timeout: 600
    proxy_read_timeout: 600

    proxy_buffering: "on"
    proxy_request_buffering: "on"
    proxy_max_temp_file_size: "0"

    proxy_ssl_verify: "off"
    proxy_ssl_protocols: "TLSv1.2 TLSv1.3"
    proxy_ssl_session_reuse: "on"
    proxy_ssl_server_name: "on"
    proxy_ssl_name: "$host"

    proxy_http_version: "1.1"

    gzip: "off"

    tcp_nopush: "on"
    tcp_nodelay: "on"

    lua_shared_dict:
      upstream-healthcheck: "10m"
      internal-status: "10m"
      plugin-limit-req: "10m"
      plugin-limit-count: "10m"
      prometheus-metrics: "15m"
      network-bucket-allowlist: "10m"

    # lua_ssl_trusted_certificate: /etc/ssl/certs/ca-certificates.crt
    lua_ssl_verify_depth: 2

plugin_attr:
  prometheus:
    export_addr:
      ip: "0.0.0.0"
      port: 9091
    enable_export_server: true
    export_uri: /apisix/prometheus/metrics
    metric_prefix: "apisix_"
    # default_buckets:
    #   - 0.005
    #   - 0.01
    #   - 0.025
    #   - 0.05
    #   - 0.1
    #   - 0.25
    #   - 0.5
    #   - 1
    #   - 2.5
    #   - 5
    #   - 10

  log-rotate:
    interval: 3600
    max_kept: 72
    max_size: 104857600 
    enable_compression: false
    timeout: 10000

