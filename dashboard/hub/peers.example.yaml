# dashboard/hub/peers.yaml — danh sách VM APISIX mà hub proxy tới (khai báo tĩnh)
# Copy:  cp peers.example.yaml peers.yaml   rồi sửa theo môi trường.
#
# Mỗi peer:
#   id         : subdomain truy cập qua hub → http://<id>.localhost:18000
#                (chữ thường a-z0-9-, không trùng nhau)
#   name       : nhãn hiển thị trên trang tổng quan
#   url        : dashboard đích mà HUB forward tới.
#                Mac KHÔNG route trực tiếp tới VM (đã test curl timeout) → đi qua
#                SSH tunnel; hub chạy trong Docker Desktop nên localhost của máy
#                host = host.docker.internal. Chạy hub không qua Docker
#                (python app.py) thì dùng http://127.0.0.1:<port-tunnel>.
#   auth_basic : "user:password" — khi dashboard peer bật AUTH_MODE=basic
#
# Tunnel tương ứng (mở trước trên máy local):
#   HCM: ssh -N -L 18080:127.0.0.1:18080 sb-api6-hcm-1
#   HNI: ssh -N -L 18081:127.0.0.1:18080 sb-api6-hni-1
#
# Scale thêm node APISIX: mở thêm 1 tunnel (port local mới) + thêm 1 block peer.
# *.localhost tự resolve 127.0.0.1 trên Chrome/Firefox; Safari cũ nếu không vào
# được thì thêm /etc/hosts:  127.0.0.1 hcm.localhost  (mỗi id 1 dòng).

# hostname/ip/dc (optional): hiển thị trong dropdown chọn VM trên dashboard
# (label: <DC> — <hostname> — <ip>; dc mặc định = id)
peers:
  - id: hcm
    name: "HCM — sb-s3-lb-api6-hcm-1 (172.27.2.206)"
    hostname: sb-s3-lb-api6-hcm-1
    ip: 172.27.2.206
    url: http://host.docker.internal:18080

  - id: hni
    name: "HNI — sb-s3-lb-api6-hni-1 (172.27.2.207)"
    hostname: sb-s3-lb-api6-hni-1
    ip: 172.27.2.207
    url: http://host.docker.internal:18081
