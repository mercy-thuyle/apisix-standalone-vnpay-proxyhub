  # ── Ceph RGW HCM — S3 endpoint / Admin Ops API ───────────────────
  # NGINX: s3-rgwhcm.sds / → http://ceph-rgwhcm (:80)
  #        s3-rgwhcm-admin.sds /admin → (proxy_pass https://ceph-rgwhcm, nhưng port thật :80 HTTP
  #        — đây là lỗi scheme trong NGINX gốc, APISIX dùng đúng scheme http)
