      scheme: http
      pass_host: pass
      nodes:
        "127.0.0.1:9999": 1
    uri: "/*"
    hosts:
      - "s3-hcm.sds.infiniband.vn"
      - "*.s3-hcm.sds.infiniband.vn"
      - "s3-hni.sds.infiniband.vn"
