# ═══GLOBAL_RULES════════════════════════════════════════════════════
# =====================================================================
#  global_rules — GUARD CHỐNG ABUSE (áp cho mọi route & service)
#  Mục đích: chặn MỘT IP đơn lẻ làm sập hệ thống. Ngưỡng đặt RỘNG;
#  việc QoS chi tiết từng tier là của 'services' bên dưới.
#  → Ngưỡng global PHẢI cao hơn mọi trần per-IP của tier, nếu không
#    nó sẽ trở thành trần thật và làm sai thiết kế tier.
# =====================================================================
global_rules:
  - id: global-abuse-guard
    plugins:
      # Trần SỐ KẾT NỐI ĐỒNG THỜI / IP.
      # Với object storage, đây là chỉ số saturation THẬT: 1 PUT 5GB giữ
      # connection hàng phút → 50 req/s nghe nhỏ nhưng có thể là 50 upload
      # 5GB song song. Concurrency quan trọng hơn req/s.
      limit-conn:
        conn: 200                 # /IP — tune theo benchmark
        burst: 50                 # cho vọt thêm 50 trước khi từ chối
        default_conn_delay: 0.1   # giây — delay mỗi conn vượt ngưỡng
        key_type: var
        key: remote_addr
        rejected_code: 429        # KHÔNG để mặc định 503 → 429 cho user/dev rõ
        rejected_msg: "Too many concurrent connections from your IP"
      # GHI CHÚ: limit-conn dùng shared dict NODE-LOCAL (không có policy redis).
      # Chạy N node → ngưỡng hiệu lực mỗi node. Tính: conn_node = conn_tổng / N.

# =====================================================================
#  CONSUMER GROUPS + CONSUMERS
#  ⚠⚠ CHỈ DÙNG CHO API CONTROL-PLANE CÓ key-auth.
#     KHÔNG dùng cho S3 data-plane: S3 SDK ký AWS SigV4, APISIX consumer
#     KHÔNG hiểu chữ ký này. Đây là lý do "định danh theo Access Key" phải
#     làm bằng custom plugin (đang ở BACKLOG), không phải bằng consumer.
#  Ví dụ áp dụng: API automation/reporting nội bộ, tooling admin tự build,
#  endpoint quản trị mà ta tự cấp apikey.
# =====================================================================
consumer_groups:
  # Gói KHÁCH HÀNG / DỊCH VỤ REAL-TIME (ưu tiên cao)
  - id: cg-premium
    plugins:
      limit-count:
        count: 4000
        time_window: 1
        key_type: var
        key: consumer_name        # đếm RIÊNG từng consumer trong group
        policy: redis             # CHƯA CÓ REDIS → 'local' + xóa redis_*
        redis_host: 127.0.0.1
        redis_port: 6379
        redis_password: ""
        redis_database: 1
        redis_timeout: 1000
        rejected_code: 429
        allow_degradation: true
        show_limit_quota_header: true

  # Gói TIÊU CHUẨN (mặc định)
  - id: cg-standard
    plugins:
      limit-count:
        count: 500
        time_window: 1
        key_type: var
        key: consumer_name
        policy: redis
        redis_host: 127.0.0.1
        redis_port: 6379
        redis_password: ""
        redis_database: 1
        redis_timeout: 1000
        rejected_code: 429
        allow_degradation: true
        show_limit_quota_header: true

  # Gói NỘI BỘ / BATCH (bóp từ đáy)
  - id: cg-internal-batch
    plugins:
      limit-req:
        rate: 50
        burst: 20
        key_type: var
        key: consumer_name
        rejected_code: 429
        allow_degradation: true

consumers:
  # Mỗi consumer = 1 account/service. group_id chính là "bảng mapping" quota.
  - username: customer_acme
    group_id: cg-premium
    plugins:
      key-auth:
        key: "<<THAY-BANG-APIKEY-THAT-cua-acme>>"

  - username: automation_reporting
    group_id: cg-standard
    plugins:
      key-auth:
        key: "<<THAY-BANG-APIKEY-THAT>>"

  - username: internal_logcleaner
    group_id: cg-internal-batch
    plugins:
      key-auth:
        key: "<<THAY-BANG-APIKEY-THAT>>"

#  ROUTE control-plane PHẢI bật key-auth thì consumer mới được nhận diện:
#  - id: route-internal-api
#    host: api-internal.sds.infiniband.vn
#    uri: "/*"
#    upstream_id: <upstream-cua-api-noi-bo>
#    plugins:
#      key-auth: {}     # consumer_group tự áp theo group_id của consumer
#  → Client gọi kèm header:  apikey: <APIKEY>

