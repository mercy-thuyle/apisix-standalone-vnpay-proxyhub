# apisix-dc1.yaml — APISIX Standalone config cho DC1 (sb-s3-lb-1)
# Migrated từ NGINX cloudian-nginx-with-prometheus
#
# ─────────────────────────────────────────────────────────────────
# APISIX STANDALONE FORMAT
# ssls[]      → certificate objects
# upstreams[] → upstream objects
# routes[]    → route objects
# ─────────────────────────────────────────────────────────────────

# ═══UPSTREAMS═════════════════════════════════════════════════
# Upstreams — định nghĩa 1 lần, reuse cho cả HTTP + HTTPS routes
upstreams:
  # ── Hyperstore Cloudian S3 HCM ────────────────────────────────────────────────────
  # NGINX: roundrobin, fail_timeout=5s
  # S3 workload: proxy_request_buffering off, gzip off
  - id: "upstream-s3-hcm.sds.infiniband.vn"
    name: "hyperstore-cloudian-hcm"
    type: roundrobin
    scheme: https
    pass_host: pass
    nodes:
      "172.26.29.231:443": 1
      "172.26.29.232:443": 1
      "172.26.29.233:443": 1
      "172.26.29.234:443": 1
    checks:
      active:
        type: https
        http_path: "/"
        host: "s3-hcm.sds.infiniband.vn"
        timeout: 5
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
    timeout:
      connect: 30
      send: 600
      read: 300

  # ── Hyperstore Cloudian S3 HNI ────────────────────────────────────────────────────
  # NGINX: roundrobin, fail_timeout=5s
  # S3 workload: proxy_request_buffering off, gzip off
  - id: "upstream-s3-hni.sds.infiniband.vn"
    name: "hyperstore-cloudian-hni"
    type: roundrobin
    scheme: https
    pass_host: pass
    nodes:
      "172.25.171.24:443": 1
      "172.25.171.25:443": 1
      "172.25.171.26:443": 1
    checks:
      active:
        type: https
        http_path: "/"
        host: "s3-hni.sds.infiniband.vn"
        timeout: 5
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
    timeout:
      connect: 30
      send: 600
      read: 300

  # ── Hyperstore Cloudian CMC (HCM nodes) ──────────────────────────────────────────
  # NGINX: ip_hash → APISIX: hash(remote_addr)
  - id: "upstream-cmc.sds.infiniband.vn"
    name: "hyperstore-cloudian-cmc"
    type: "chash"
    hash_on: "vars"
    key: "remote_addr"
    scheme: "https"
    pass_host: "pass"
    nodes:
      "172.26.29.231:8443": 1
      "172.26.29.232:8443": 1
      "172.26.29.233:8443": 1
    checks:
      active:
        type: "https"
        http_path: "/"
        host: "cmc.sds.infiniband.vn"
        timeout: 5
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
    timeout:
      connect: 30
      send: 600
      read: 300

  # ── Hyperstore Cloudian HyperIQ (Grafana/Dashboard) ──────────────────────────────
  # Single node, HTTP
  - id: "upstream-hyperiq.sds.infiniband.vn"
    name: "hyperstore-cloudian-hyperiq"
    type: "roundrobin"
    scheme: "http"
    pass_host: "pass"
    nodes:
      "172.26.29.153:3000": 1
    checks:
      active:
        type: "http"
        http_path: "/"
        host: "hyperiq.sds.infiniband.vn"
        timeout: 5
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
    timeout:
      connect: 30
      send: 600
      read: 300

  # ── Hyperstore Cloudian S3 Admin ──────────────────────────────────────────────────
  # NGINX: ip_hash
  - id: "upstream-s3-admin.sds.infiniband.vn"
    name: "hyperstore-cloudian-admin"
    type: "chash"
    hash_on: "vars"
    key: "remote_addr"
    scheme: "https"
    pass_host: "pass"
    nodes:
      "172.26.29.231:19443": 1
      "172.26.29.232:19443": 1
      "172.26.29.233:19443": 1
    checks:
      active:
        type: "https"
        http_path: "/"
        host: "s3-admin.sds.infiniband.vn"
        timeout: 5
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
    timeout:
      connect: 30
      send: 600
      read: 300

  # ── Hyperstore Cloudian IAM ───────────────────────────────────────────────────────
  # NGINX: ip_hash, keepalive 12 → APISIX: chash + keepalive_pool
  # Reused bởi STS route (sts.sds.infiniband.vn → proxy_pass https://hyperstore-cloudian-iam)
  - id: "upstream-iam.sds.infiniband.vn"
    name: "hyperstore-cloudian-iam"
    type: "chash"
    hash_on: "vars"
    key: "remote_addr"
    scheme: "https"
    pass_host: "pass"
    keepalive_pool:
      size: 12
      idle_timeout: 60
      requests: 1000
    nodes:
      "172.26.29.231:16443": 1
      "172.26.29.232:16443": 1
      "172.26.29.233:16443": 1
    checks:
      active:
        type: "https"
        http_path: "/"
        host: "iam.sds.infiniband.vn"
        timeout: 5
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
    timeout:
      connect: 30
      send: 600
      read: 300

  # ── Hyperstore Cloudian SQS ────────────────────────────────────────────────
  # NGINX: ip_hash, keepalive 12 → chash + keepalive_pool
  # Backend: HTTP :18090, 3 nodes HCM
  - id: "upstream-sqs.sds.infiniband.vn"
    name: "hyperstore-cloudian-sqs"
    type: chash
    hash_on: vars
    key: remote_addr
    scheme: http
    pass_host: pass
    keepalive_pool:
      size: 12
      idle_timeout: 60
      requests: 1000
    nodes:
      "172.26.29.231:18090": 1
      "172.26.29.232:18090": 1
      "172.26.29.233:18090": 1
    checks:
      active:
        type: http
        http_path: "/"
        host: "sqs.sds.infiniband.vn"
        timeout: 5
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
    timeout:
      connect: 30
      send: 600
      read: 300

  # ── MinIO ──────────────────────────────────────────────────────────────
  # Backend: HTTP :9000, 4 nodes
  - id: "upstream-minio.sds.infiniband.vn"
    name: "minio"
    type: "roundrobin"
    scheme: "http"
    pass_host: "pass"
    nodes:
      "172.26.29.185:9000": 1
      "172.26.29.158:9000": 1
      "172.26.29.170:9000": 1
      "172.26.29.175:9000": 1
    checks:
      active:
        type: "http"
        http_path: "/minio/health/live"
        host: "minio.sds.infiniband.vn"
        timeout: 5
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
    timeout:
      connect: 30
      send: 600
      read: 300

  # ── Ceph RGW HCM — Admin UI ─────────────────────────────────────
  # NGINX: s3-rgwhcm-admin.sds / (default) → https://ceph-rgwhcm-admin (:8443)
  - id: "upstream-s3-rgwhcm-admin.sds.infiniband.vn"
    name: "ceph-rgw-hcm"
    type: roundrobin
    scheme: https
    pass_host: pass
    nodes:
      "172.25.155.201:8443": 1
    checks:
      active:
        type: https
        http_path: "/"
        host: "s3-rgwhcm-admin.sds.infiniband.vn"
        timeout: 5
        https_verify_certificate: false
        req_headers:
          - "User-Agent: APISIX-HealthCheck"
        healthy:
          interval: 10
          successes: 2
        unhealthy:
          interval: 5
          http_failures: 3
          tcp_failures: 3
    timeout:
      connect: 30
      send: 600
      read: 300

  # ── Ceph RGW HCM — Grafana ──────────────────────────────────────
  # NGINX: s3-rgwhcm-admin.sds /d → http://ceph-rgwhcm-grafana (:3000)
  - id: "upstream-grafana-s3-rgwhcm-admin.sds.infiniband.vn"
    name: "ceph-rgw-hcm"
    type: roundrobin
    scheme: http
    pass_host: pass
    nodes:
      "172.25.155.201:3000": 1
    checks:
      active:
        type: http
        http_path: "/"
        host: "s3-rgwhcm-admin.sds.infiniband.vn"
        timeout: 5
