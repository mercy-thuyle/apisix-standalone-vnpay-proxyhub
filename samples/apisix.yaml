  # ── Ceph RGW HNI — Admin UI ─────────────────────────────────────
  # NGINX: s3-rgwhni-admin.sds / (default) → https://ceph-rgwhni-admin (:8443)
  - id: "upstream-s3-rgwhni-admin.sds.infiniband.vn"
    name: "ceph-rgw-hni"
