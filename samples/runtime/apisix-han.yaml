# ═══ global_rules (6 files) ════════════════════════════════════════════════
global_rules:
  # ── src: global_rules/global-abuse-guard.yaml
  - id: global-abuse-guard
    plugins:

      limit-count:
        rules:
          - key: "${http_x_node_id}"
            count: 50000
            time_window: 60
            header_prefix: "Global"
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:global-guard]: Too many total requests on this gateway node in the last 60s. Not a Cloudian error — this is gateway-level global throttling."
        allow_degradation: true
        show_limit_quota_header: true
        policy: local

      limit-conn:
        rules:
          - key: "${http_x_node_id}"
            conn: 49500
            burst: 500
        rejected_code: 429        # KHÔNG để mặc định 503 → 429 cho user/dev rõ
        rejected_msg: "[APISIX-QOS:global-guard]: Too many total concurrent connections on this gateway node. Concurrent connection limit exceeded (< 50000). This is gateway-level global throttling."
        default_conn_delay: 0.1
        only_use_default_delay: true
        allow_degradation: true
        policy: local


      serverless-pre-function:
        phase: rewrite
        functions:
          - |
            return function(conf, ctx)
              -- NODE_ID lấy từ ENV do docker-compose set (apisix-standalone-${DC_PROFILE}-${ORDER_NUM}).
              -- Đặt ở ĐÂY vì serverless-pre-function (priority 10000) chạy TRƯỚC limit-conn (1003)/
              -- limit-count (1002) trong cùng phase rewrite — header set kịp trước khi 2 plugin limit
              -- đọc key "http_x_node_id".
              ngx.req.set_header("X-Node-Id", os.getenv("NODE_ID") or "-")
              ngx.req.set_header("X-Route-Id", ctx.matched_route and ctx.matched_route.value.id or "-")
              ngx.req.set_header("X-Service-Id", ctx.matched_route and ctx.matched_route.value.service_id or "-")
              -- consumer_name: giống route_id, KHÔNG phải nginx variable có sẵn ($consumer_name
              -- sẽ làm nginx crash compile y hệt $route_id). Lấy qua ctx.consumer (Lua), set
              -- header để access_log_format đọc qua $http_x_consumer thay vì gọi thẳng biến.
              -- Chỉ có giá trị khi route dùng key-auth/jwt-auth (consumer_groups); S3 SDK ký
              -- SigV4 thì ctx.consumer là nil → fallback "-".
              ngx.req.set_header("X-Consumer", ctx.consumer and ctx.consumer.username or "-")
            end

  # ── src: global_rules/global-kafka-logger.yaml
  - id: global-kafka-logger
    # status: 0
    plugins:
      kafka-logger:
        brokers:
          - host: "172.26.24.80"
            port: 31421
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"
          - host: "172.26.24.80"
            port: 30215
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"
          - host: "172.26.24.80"
            port: 30412
            sasl_config:
              mechanism: "SCRAM-SHA-512"
              user: "${{KAFKA_SASL_USER}}"
              password: "${{KAFKA_SASL_PASSWORD}}"

        kafka_topic: "apisix-gateway-${{DC_PROFILE}}"
        producer_type: async 
        batch_max_size: 1
        include_resp_body: false
        # include_resp_body_expr: []
        timeout: 3
        # key: "$remote_addr"
        ssl: true
        ssl_verify: false
        meta_format: default
        api_version: 2

  # ── src: global_rules/global-prometheus.yaml
  - id: global-prometheus
    plugins:
      prometheus: {}

  # ── src: global_rules/global-request-id.yaml
  - id: global-request-id
