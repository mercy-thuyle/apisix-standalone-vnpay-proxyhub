# ═══ plugin_configs (3 files) ════════════════════════════════════════════════
plugin_configs:
  # ── src: plugin_configs/plugin-config-qos-auth.yaml
  - id: "plugin-config-qos-auth"
    plugins:

      # ip-restriction:
      #   blacklist: ["10.x.x.x/32"]
      #   message: "Access denied"

      limit-count:
        rules:
          - key: "${remote_addr}"
            count: 5000
            time_window: 1
            header_prefix: "QoS-auth"
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:qos-auth]: Auth/control rate limit exceeded (5000 req/s). Not a Cloudian error -if experiencing high retry rates, check for SDK retry loops or credential refresh storms."
        allow_degradation: true
        show_limit_quota_header: true
        policy: local

      serverless-post-function:
        phase: header_filter
        functions:
          - |
            return function(conf, ctx)
              ngx.header["X-RateLimit-Layer"] = "2"
              local remaining = tonumber(ngx.header["X-RateLimit-Remaining"])
              local limit     = tonumber(ngx.header["X-RateLimit-Limit"])
              if not remaining or not limit or limit == 0 then return end

              local used     = limit - remaining
              local used_pct = used / limit * 100
              local client_ip = ngx.var.remote_addr or "unknown"

              -- PRE-GA THRESHOLDS — nâng lại 50/70 khi GA chính thức + có baseline p95.
              local warn_pct = 50
              local info_pct = 20

              if used_pct >= warn_pct then
                local msg = string.format(
                  "[APISIX-QOS:qos-auth]: WARN: IP=%s used=%d req/s (%.0f%% of %d quota). "
                  .. "Not a Cloudian message. "
                  .. "High auth rate — check for SDK retry loops, "
                  .. "credential refresh storms, token cache issues, or "
                  .. "brute-force AKID probing (pre-GA baseline should be near-zero).",
                  client_ip, used, used_pct, limit)
                ngx.header["X-RateLimit-Warning"] = msg

                ngx.log(ngx.INFO,
                  string.format("[APISIX-QOS:qos-auth | rate-limit-warning] service=auth phase=pre-GA IP=%s "
                    .. "used=%d/s used_pct=%.0f%% "
                    .. "warn_pct=%d%% hard_limit=%d/s",
                    client_ip, used, used_pct, warn_pct, limit))

              elseif used_pct >= info_pct then
                ngx.header["X-RateLimit-Warning"] = string.format(
                  "[APISIX-QOS:qos-auth]: INFO: IP=%s used=%d req/s (%.0f%% of %d quota). "
                  .. "Not a Cloudian message. Monitor credential refresh frequency.",
                  client_ip, used, used_pct, limit)

                ngx.log(ngx.INFO,
                  string.format("[APISIX-QOS:qos-auth | rate-limit-info] service=auth phase=pre-GA IP=%s "
                    .. "used=%d/s used_pct=%.0f%%",
                    client_ip, used, used_pct))
              end
            end

      api-breaker:
        break_response_code: 503
        break_response_body: "Auth upstream temporarily unavailable (circuit open). Retry in 120 seconds."
        max_breaker_sec: 120
        unhealthy:
          http_statuses: [500, 502, 503]
          failures: 5
        healthy:
          http_statuses: [200, 201, 204]
          successes: 3
        policy: redis
        redis_host: 127.0.0.1 
        redis_port: 6379
        redis_password: "$ENV://REDIS_PASSWORD"
        redis_database: 1

  # ── src: plugin_configs/plugin-config-qos-internal-console.yaml
  - id: "plugin-config-qos-internal-console"
    plugins:

      # proxy-control:
      #   request_buffering: false

      # proxy-buffering:
      #   disable_proxy_buffering: true

      limit-conn:
        conn: 4500
        burst: 500
        key_type: var
        key: remote_addr
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:qos-internal-console]: Too many concurrent connections to internal console. Not a Cloudian error — check for stuck job/script."
        default_conn_delay: 0.1
        only_use_default_delay: true
        allow_degradation: true
        policy: local

      # ip-restriction:
      #   blacklist: []
      #   message: "Your IP has been temporarily blocked from internal console — contact platform team"

      response-rewrite:
        headers:
          set:
            X-RateLimit-Layer: "2"

  # ── src: plugin_configs/plugin-config-traffic-classifier.yaml
  - id: "plugin-config-traffic-classifier"
    plugins:

      proxy-control:
        request_buffering: false

      proxy-buffering:
        disable_proxy_buffering: true

      custom.s3-accesskey-extractor: {}

      limit-conn:
        rules:
          - key: "${http_x_s3_bucket_name}"
            conn: 950
            burst: 50
          - key: "${http_x_s3_akid_only}"
            conn: 750
            burst: 50
          - key: "${http_x_snat}"
            conn: 950
            burst: 50
          - key: "${http_x_snat_ip}"
            conn: 250
            burst: 50
          - key: "${http_x_real_ip}"
            conn: 50
            burst: 50
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:traffic-classifier]: Rate limit connections exceeded for your traffic group. Not a Cloudian error  — Check X-RateLimit-* headers. Too many parallel connections."
        default_conn_delay: 0.1
        only_use_default_delay: true
        allow_degradation: true
        policy: local

      limit-count:
        rules:
          - key: "${http_x_s3_bucket_name}"
            count: 1000
            time_window: 60
            header_prefix: "Authen"
          - key: "${http_x_s3_akid_only}"
            count: 800
            time_window: 60
            header_prefix: "AkidOnly"
          - key: "${http_x_snat}"
            count: 1000
            time_window: 60
            header_prefix: "Snat-Group"
          - key: "${http_x_snat_ip}"
            count: 300
            time_window: 60
            header_prefix: "Snat-Ip"
          - key: "${http_x_real_ip}"
            count: 100
            time_window: 60
            header_prefix: "Anon"
        rejected_code: 429
        rejected_msg: "[APISIX-QOS:traffic-classifier]: Rate limit exceeded for your traffic group. Not a Cloudian error — Check X-RateLimit-* headers. If you are anonymous, use authenticated access for higher quota."
        allow_degradation: true
        show_limit_quota_header: true
        policy: local

      serverless-post-function:
        phase: header_filter
        functions:
          - |
            return function(conf, ctx)
                local log_level = require("log-level-utils")

                -- id của chính plugin_config này — khai vào ngx_log_scope sẽ
                -- bật log cho CẢ 3 route dùng chung file này.
                local SELF_ID = "plugin-config-traffic-classifier"

                -- id route thật đang xử lý request — khai riêng route id
                -- này vào ngx_log_scope sẽ CHỈ bật log cho đúng route đó,
                -- không ảnh hưởng 2 route còn lại. Nguồn xác nhận cách lấy
                -- route id: apisix/plugins/example-plugin.lua (file mẫu
                -- chính thức apache/apisix), _M.access dùng
                -- ctx.matched_route.value.id.
                local route_id = (ctx.matched_route and ctx.matched_route.value
                    and ctx.matched_route.value.id) or "unknown"

                -- Header cố định — xác định NGAY response này có đi qua Layer 2
                -- (Dynamic Policy) hay không, không phụ thuộc có bị warn/block
                -- hay không. Đặt tên X-RateLimit-Layer (không phải X-QoS-Layer)
                -- để nằm liền kề alphabet với X-RateLimit-Limit/Remaining/Reset/
                -- Warning khi dump toàn bộ header — trace nhanh hơn khi debug.

                ngx.header["X-RateLimit-Layer"] = "2"

                local function check_soft_limit(header_prefix, label, warn_pct, info_pct)
                    local remaining = tonumber(ngx.header["X-" .. header_prefix .. "-RateLimit-Remaining"])
                    local limit     = tonumber(ngx.header["X-" .. header_prefix .. "-RateLimit-Limit"])
                    if not remaining or not limit or limit == 0 then
                        return
                    end

                    local used_pct = (limit - remaining) / limit * 100
                    if used_pct >= warn_pct then
                        ngx.header["X-RateLimit-Warning"] = "[APISIX-QOS:traffic-classifier]: WARN: group=" ..
                            label .. " used_pct=" .. string.format("%.1f", used_pct) ..
                            "%. Not a Cloudian message."
                        -- Cảnh báo thật (đã vượt warn_pct) — LUÔN log, KHÔNG
                        -- qua log_level.emit(), vì đây là warn nghiệp vụ
                        -- thật, không phải log [info] thường quy.
                        ngx.log(ngx.WARN, "[APISIX-QOS:traffic-classifier | rate-limit-warning] group=", label,
                            " used_pct=", string.format("%.1f", used_pct),
                            " limit=", limit, " remaining=", remaining)
                    elseif used_pct >= info_pct then
                        -- Log [info] thường quy — chỉ hiện khi bật
                        -- ngx_log_scope cho SELF_ID hoặc route_id trong
                        -- plugin_metadata "custom.log-level", mặc định
                        -- im lặng.
                        log_level.emit("ngx", { SELF_ID, route_id }, log_level.LEVEL_RANK.info,
                            "[APISIX-QOS:traffic-classifier | rate-limit-info] group=", label,
                            " used_pct=", string.format("%.1f", used_pct),
                            " limit=", limit, " remaining=", remaining)
                    end
                end

                -- Ngưỡng test riêng cho workload này (KHÔNG phải số production
                -- thật của Global):
                --   Anonymous     count=50   (siết chặt nhất — traffic lạ nhất)
                --   SNAT từng IP  count=300  (= Authen — Mercy chủ đích cho phép
                --                             SNAT rộng bằng hoặc hơn Authen)
                --   Authenticated count=300  (độ tin cậy cao nhất theo 1 định danh)
                --   Authenticated (AKID, không bucket) count=300 — cùng độ tin
                --                             cậy AKID, dùng khi request không
                --                             nhắm 1 bucket cụ thể (ListBuckets/
                --                             account-op qua aws cli/console).
                --   SNAT cả dải   count=500  (> Authen — đại diện NHIỀU user
                --                             qua chung 1 NAT, không phải 1 định danh)
                -- warn=50%, info=20% — cùng tỉ lệ đã dùng ở plugin-config-qos-auth.
                check_soft_limit("Authen",     "authenticated", 50, 20)
                check_soft_limit("AkidOnly",   "authenticated-akid-only", 50, 20)
                check_soft_limit("Snat-Group", "snat-group",    50, 20)
                check_soft_limit("Snat-Ip",    "snat-ip",       50, 20)
                check_soft_limit("Anon",       "anonymous",     50, 20)
            end


